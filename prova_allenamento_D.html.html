<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova di allenamento D – Grammatica e lessico (livello avanzato)</title>
<style>
:root{--bg:#f6f1e7;--ink:#1e1c19;--mute:#7a7367;--card:#fffdf8;--line:#ddd3c0;--acc:#2b6cb0;--ok:#2f8f5b;--ko:#c62d3a;--okb:#e3f3ea;--kob:#fbe6e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--ink:#f3efe6;--mute:#9d978a;--card:#232127;--line:#3a3740;--acc:#6fb0f0;--ok:#63c98f;--ko:#f0666f;--okb:#1f3a2c;--kob:#40222a}}
:root[data-theme="dark"]{--bg:#17161a;--ink:#f3efe6;--mute:#9d978a;--card:#232127;--line:#3a3740;--acc:#6fb0f0;--ok:#63c98f;--ko:#f0666f;--okb:#1f3a2c;--kob:#40222a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:clamp(16px,1.7vw,19px);line-height:1.5}
.w{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:clamp(24px,4vw,36px);margin:.2em 0}
.sub{color:var(--mute);margin:0 0 1em}
.q{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.q.ok{border-color:var(--ok);background:var(--okb)}.q.ko{border-color:var(--ko);background:var(--kob)}
.h{display:flex;justify-content:space-between;gap:8px;font-size:.8em;color:var(--mute);margin-bottom:6px}
.t{font-weight:700;margin-bottom:8px}
label{display:block;padding:6px 8px;border-radius:8px;cursor:pointer}
label:hover{background:var(--line)}
input{margin-right:8px;accent-color:var(--acc)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th{font-size:.85em}td:first-child{text-align:left}
tr.r-ko td:first-child{color:var(--ko)}tr.r-ok td:first-child{color:var(--ok)}
.w2{margin-top:8px;font-size:.92em;color:var(--mute)}
.w2 b{color:var(--ink)}
button{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.6em 1.4em;cursor:pointer}
#res{display:none;background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:14px 16px;margin:14px 0}
#res .big{font-size:1.8em;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:2px 0 10px}.bar i{display:block;height:100%;background:var(--acc)}
</style>
</head>
<body>
<div class="w">
<h1>Prova di allenamento D</h1>
<p class="sub">Livello avanzato · Grammatica e lessico · classe terza · 30 punti. Rispondi a tutte le domande, poi premi «Consegna».</p>
<div id="f"></div>
<button id="go">Consegna</button>
<div id="res"></div>
</div>
<script>
var P=['Parte 1 · La frase','Parte 2 · I complementi','Parte 3 · La forma del verbo','Parte 4 · Piccole parole','Parte 5 · Lessico'];
var Q=[
{k:'s',p:0,q:'In quale delle seguenti frasi è presente un predicato nominale?',o:['I suoi genitori rimasero a Bologna per tutta l\'estate.','Alla fine della lezione la classe era già in cortile.','Con il passare degli anni la casa era diventata un luogo silenzioso e triste.','Quel giorno il vento soffiava con forza sulla costa.'],c:2,w:'<b>Era diventata un luogo</b>: copula + nome del predicato. <i>Rimasero a Bologna</i> = si fermarono, <i>era in cortile</i> = si trovava: predicati verbali.'},
{k:'s',p:0,q:'Leggi la frase: «Ieri, tornando a casa, ha incontrato dei vecchi compagni di scuola.» Solo una delle affermazioni è vera. Quale?',o:['«dei vecchi compagni» è soggetto partitivo.','Il soggetto è sottinteso e «dei vecchi compagni» è oggetto partitivo.','Il soggetto è «compagni».','Il soggetto è mancante del tutto.'],c:1,w:'<b>Ha incontrato</b> ha soggetto sottinteso (lui/lei). <i>Dei vecchi compagni</i> = alcuni vecchi compagni, e risponde a «chi?»: oggetto partitivo.'},
{k:'s',p:1,q:'In quale frase «DEI» ha valore partitivo?',o:['La voce dei cantanti si sentiva da lontano.','Ho ricevuto dei consigli molto utili.','Il rumore dei motori copriva ogni parola.','La paura dei bambini era evidente.'],c:1,w:'Puoi dire <b>«ho ricevuto alcuni consigli»</b>: partitivo. Nelle altre <i>dei</i> = di + i e risponde a «di chi? di che cosa?»: specificazione.'},
{k:'s',p:1,q:'In quale frase la particella «mi» è complemento di termine?',o:['Mi hanno ascoltato con grande attenzione.','Mi hanno affidato un compito importante.','Quel rumore improvviso mi ha spaventato.','Mi hanno aspettato all\'uscita.'],c:1,w:'<b>Mi hanno affidato un compito</b> = hanno affidato un compito a me. Nelle altre: hanno ascoltato / spaventato / aspettato <i>me</i> (oggetto).'},
{k:'s',p:2,q:'In quale frase è presente un verbo di forma passiva?',o:['Le vacanze sono finite troppo presto.','Dopo la partita i tifosi si sono abbracciati a lungo.','I nuovi vicini sono stati visti spesso in giardino.','Molti turisti sono tornati nella stessa località.'],c:2,w:'<b>Sono stati visti</b>: il soggetto subisce l\'azione. <i>Sono finite, sono tornati</i> sono attivi (intransitivi); <i>si sono abbracciati</i> è riflessivo reciproco.'},
{k:'s',p:2,q:'In quale frase il verbo è riflessivo reciproco?',o:['Giulia e Marta si scrivono ogni settimana.','Giulia si è vestita in fretta.','Giulia si è accorta dell\'errore.','Giulia si lava i capelli ogni sera.'],c:0,w:'<b>Si scrivono</b> = l\'una scrive all\'altra. Le altre: <i>si è vestita</i> proprio, <i>si è accorta</i> pronominale, <i>si lava i capelli</i> apparente.'},
{k:'s',p:3,q:'In quale frase «CHE» è un pronome relativo con funzione di complemento oggetto?',o:['Il film che ho visto ieri era bellissimo.','L\'uomo che parla al telefono è mio zio.','So che sei stanco dopo il viaggio.','Ho tanto sonno che crollo dalla stanchezza.'],c:0,w:'<b>Il film che ho visto</b>: che = il quale, ed è ciò che «ho visto» (oggetto). In <i>l\'uomo che parla</i> è soggetto; le altre due sono congiunzioni.'},
{k:'g',p:1,q:'Analizza le particelle in grassetto: complemento oggetto o complemento di termine?',cols:['Oggetto','Termine'],rows:[['<b>Le</b> ho viste ieri al parco.',0],['<b>Le</b> ho detto tutta la verità.',1],['Non <b>ti</b> ho capito bene.',0],['<b>Ci</b> ha promesso una risposta.',1]],w:'<b>Le</b> plurale (= loro) è oggetto; <b>le</b> singolare (= a lei) è termine. Per <i>ti, ci</i> usa il test «te / noi» oppure «a te / a noi».'},
{k:'g',p:1,q:'Analizza le parole in maiuscolo: soggetto partitivo, oggetto partitivo o specificazione?',cols:['Soggetto partitivo','Oggetto partitivo','Specificazione'],rows:[['Sono venuti <b>DEGLI OSPITI</b> inattesi.',0],['Ho ritrovato il diario <b>DELLA MIA INFANZIA</b>.',2],['Per il pranzo ho preparato <b>DELLE LASAGNE</b>.',1],['Il profumo <b>DEI GELSOMINI</b> invadeva il giardino.',2]],w:'Prova con <b>«alcuni / un po\' di»</b>. Se funziona è partitivo: soggetto se «fa» l\'azione, oggetto se la «riceve». Altrimenti: di chi? di che cosa? → specificazione.'},
{k:'g',p:3,q:'Nella frase «Se Marta ti da un consiglio, da ascolto: è un\'amica che ti vuole bene da sempre e ti aiuta da qualche anno» la parola «da» è scritta senza segni. Indica come va scritta.',cols:['Accento','Apostrofo','Nessun segno'],rows:[['DA (1): ti <b>da</b> un consiglio',0],['DA (2): <b>da</b> ascolto',1],['DA (3): <b>da</b> sempre',2],['DA (4): <b>da</b> qualche anno',2]],w:'<b>Dà</b> (dava) verbo; <b>da\'</b> (dai) ordine; <b>da</b> preposizione (<i>da sempre, da qualche anno</i> indicano tempo).'},
{k:'g',p:2,q:'Indica la forma del verbo in ciascuna frase.',cols:['Attiva','Passiva','Riflessiva'],rows:[['Il sentiero è stato chiuso dopo la frana.',1],['I due fratelli si sono aiutati a vicenda.',2],['Le campane della chiesa hanno suonato a lungo.',0],['Il concerto verrà annullato in caso di pioggia.',1]],w:'<b>Passiva</b>: il soggetto subisce (<i>è stato chiuso, verrà annullato</i>). <b>Riflessiva reciproca</b>: <i>si sono aiutati</i> = l\'uno l\'altro. <b>Attiva</b>: <i>hanno suonato</i>.'},
{k:'g',p:4,q:'La parola <b>PUNTO</b> è polisemica. Individua il significato in ciascuna frase.',cols:['Segno di punteggiatura','Luogo preciso','Momento','Unità di punteggio'],rows:[['Metti un <b>punto</b> alla fine della frase.',0],['Ci vediamo nel <b>punto</b> di ritrovo.',1],['Era sul <b>punto</b> di partire.',2],['Ha vinto per un solo <b>punto</b> di scarto.',3]],w:'Il significato dipende dal contesto. <i>Sul punto di</i> = in procinto di, cioè un momento.'},
{k:'g',p:4,q:'Indica come è usata la parola <b>LINGUA</b>.',cols:['Specialistico','Metaforico','Proprio'],rows:[['Mi sono morso la <b>lingua</b> mentre mangiavo.',2],['Una <b>lingua</b> di terra si spinge nel mare.',1],['Per i linguisti la <b>lingua</b> è un sistema di segni.',0]],w:'<b>Proprio</b>: l\'organo. <b>Metaforico</b>: la terra ha una forma «a lingua». <b>Specialistico</b>: termine della linguistica.'}
];
var f=document.getElementById('f'),h='';
Q.forEach(function(x,i){
var pts=x.k=='s'?1:x.rows.length;x.pts=pts;
h+='<div class="q" id="q'+i+'"><div class="h"><span>Domanda '+(i+1)+' · '+P[x.p]+'</span><span>'+pts+(pts==1?' punto':' punti')+'</span></div><div class="t">'+x.q+'</div>';
if(x.k=='s'){x.o.forEach(function(o,j){h+='<label><input type="radio" name="q'+i+'" value="'+j+'">'+o+'</label>'})}
else{h+='<div class="tw"><table><tr><th></th>'+x.cols.map(function(c){return'<th>'+c+'</th>'}).join('')+'</tr>';
x.rows.forEach(function(r,k){h+='<tr id="q'+i+'r'+k+'"><td>'+r[0]+'</td>'+x.cols.map(function(c,j){return'<td><input type="radio" name="q'+i+'r'+k+'" value="'+j+'"></td>'}).join('')+'</tr>'});
h+='</table></div>'}
h+='<div class="w2" id="w'+i+'"></div></div>'});
f.innerHTML=h;
function val(n){var e=document.querySelector('input[name="'+n+'"]:checked');return e?+e.value:-1}
document.getElementById('go').onclick=function(){
var tot=0,max=0,per=P.map(function(){return[0,0]});
Q.forEach(function(x,i){var got=0,box=document.getElementById('q'+i),note='';
if(x.k=='s'){var v=val('q'+i);if(v==x.c)got=1;else note='Risposta corretta: <b>'+x.o[x.c].replace(/<[^>]+>/g,'')+'</b>. '}
else x.rows.forEach(function(r,k){var v=val('q'+i+'r'+k),tr=document.getElementById('q'+i+'r'+k);
if(v==r[1]){got++;tr.className='r-ok'}else{tr.className='r-ko';note+='Riga '+(k+1)+': <b>'+x.cols[r[1]]+'</b>. '}});
box.className='q '+(got==x.pts?'ok':'ko');
document.getElementById('w'+i).innerHTML=(got==x.pts?'✔ ':'✘ '+note)+'<br>'+x.w;
tot+=got;max+=x.pts;per[x.p][0]+=got;per[x.p][1]+=x.pts;
box.querySelectorAll('input').forEach(function(e){e.disabled=true})});
var r='<div class="big">'+tot+' / '+max+'</div><p>Risultato per argomento:</p>';
per.forEach(function(p,i){if(!p[1])return;var pc=Math.round(100*p[0]/p[1]);
r+='<div>'+P[i]+' · '+p[0]+'/'+p[1]+(pc<60?' → da ripassare':'')+'</div><div class="bar"><i style="width:'+pc+'%"></i></div>'});
r+='<button onclick="location.reload()">Riprova</button>';
var e=document.getElementById('res');e.innerHTML=r;e.style.display='block';e.scrollIntoView({behavior:'smooth'});
this.style.display='none'};
</script>
</body>
</html>
