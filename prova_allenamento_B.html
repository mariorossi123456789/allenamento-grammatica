<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova di allenamento B – Grammatica e lessico</title>
<style>
:root{--bg:#f6f1e7;--ink:#1e1c19;--mute:#7a7367;--card:#fffdf8;--line:#ddd3c0;--acc:#2b6cb0;--ok:#2f8f5b;--ko:#c62d3a;--okb:#e3f3ea;--kob:#fbe6e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--ink:#f3efe6;--mute:#9d978a;--card:#232127;--line:#3a3740;--acc:#6fb0f0;--ok:#63c98f;--ko:#f0666f;--okb:#1f3a2c;--kob:#40222a}}
:root[data-theme="dark"]{--bg:#17161a;--ink:#f3efe6;--mute:#9d978a;--card:#232127;--line:#3a3740;--acc:#6fb0f0;--ok:#63c98f;--ko:#f0666f;--okb:#1f3a2c;--kob:#40222a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:clamp(16px,1.7vw,19px);line-height:1.5}
.w{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:clamp(24px,4vw,36px);margin:.2em 0}
.menu{display:inline-block;margin-bottom:8px;color:var(--acc);text-decoration:none;font-size:.95em}
.sub{color:var(--mute);margin:0 0 1em}
.q{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.q.ok{border-color:var(--ok);background:var(--okb)}.q.ko{border-color:var(--ko);background:var(--kob)}
.h{display:flex;justify-content:space-between;gap:8px;font-size:.8em;color:var(--mute);margin-bottom:6px}
.t{font-weight:700;margin-bottom:8px}
label{display:block;padding:6px 8px;border-radius:8px;cursor:pointer}
label:hover{background:var(--line)}
input{margin-right:8px;accent-color:var(--acc)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th{font-size:.85em}td:first-child{text-align:left}
tr.r-ko td:first-child{color:var(--ko)}tr.r-ok td:first-child{color:var(--ok)}
.w2{margin-top:8px;font-size:.92em;color:var(--mute)}
.w2 b{color:var(--ink)}
button{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.6em 1.4em;cursor:pointer}
#res{display:none;background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:14px 16px;margin:14px 0}
#res .big{font-size:1.8em;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:2px 0 10px}.bar i{display:block;height:100%;background:var(--acc)}
</style>
</head>
<body>
<div class="w">
<a class="menu" id="menu" href="index.html">← Torna al menu</a>
<h1>Prova di allenamento B</h1>
<p class="sub">Grammatica e lessico · classe terza · 30 punti. Rispondi a tutte le domande, poi premi «Consegna».</p>
<div id="f"></div>
<button id="go">Consegna</button>
<div id="res"></div>
</div>
<script>
var MENU_URL='index.html'; // indirizzo della pagina con il menu (cambialo se il file ha un altro nome)
document.getElementById('menu').href=MENU_URL;
var P=['Parte 1 · La frase','Parte 2 · I complementi','Parte 3 · La forma del verbo','Parte 4 · Piccole parole','Parte 5 · Lessico'];
var Q=[
{k:'s',p:0,q:'In quale delle seguenti frasi è presente un predicato nominale?',o:['Il museo apre alle nove.','La cena è stata deliziosa.','Le studentesse sono in biblioteca.','Ci sono molti turisti in piazza.'],c:1,w:'<b>È stata deliziosa</b>: copula + nome del predicato. <i>Sono in biblioteca</i> = si trovano, <i>ci sono</i> = esistono: predicati verbali.'},
{k:'s',p:0,q:'Quale predicato verbale si può aggiungere al soggetto «la squadra»?',o:['è molto affiatata','è fortissima','è in campo','è la favorita'],c:2,w:'<b>È in campo</b> = si trova in campo: «essere» ha senso compiuto, predicato verbale. Le altre sono essere + nome del predicato (predicati nominali).'},
{k:'s',p:0,q:'Leggi la frase: «Al termine della gita raggiungemmo finalmente il rifugio.» Solo una delle affermazioni è vera. Quale?',o:['Il soggetto è partitivo.','Il soggetto è sottinteso.','Il soggetto è mancante del tutto.','Il soggetto subisce l\'azione.'],c:1,w:'<b>Raggiungemmo</b> finisce in -mmo: il soggetto «noi» non è scritto ma si ricava dal verbo.'},
{k:'s',p:1,q:'In quale delle seguenti frasi è presente un complemento oggetto?',o:['Luigi è considerato un ottimo studente.','Sono partito con Marta ieri sera.','Il professore spiegò la lezione con calma.','Paolo diventerà dottore.'],c:2,w:'<b>La lezione</b> risponde a «che cosa?» senza preposizione. Nelle altre non c\'è nessun oggetto.'},
{k:'s',p:2,q:'Quale delle seguenti frasi contiene un verbo riflessivo?',o:['Marco si è lavato prima di cena.','Ti ho chiamato ieri.','Mi hanno aiutato molto.','Il cameriere ci porta il caffè.'],c:0,w:'<b>Si è lavato</b>: Marco lava se stesso. Negli altri casi il pronome indica un\'altra persona.'},
{k:'s',p:3,q:'In quale frase «CHE» è una congiunzione?',o:['La torta che hai preparato è buonissima.','Il ragazzo che parla è mio cugino.','Mi ha detto che partirà domani.','I libri che ho comprato sono nuovi.'],c:2,w:'Solo in <b>mi ha detto che partirà</b> il test «il quale» non funziona. Negli altri casi è pronome relativo.'},
{k:'s',p:3,q:'In quale frase l\'ortografia è corretta?',o:['Marco a due fratelli.','Ho comprato un po\' di pane.','Perchè non rispondi?','Qual\'è la tua città?'],c:1,w:'<b>Un po\'</b> vuole l\'apostrofo. Le altre: <i>ha</i> (aveva), <i>perché</i> con accento acuto, <i>qual è</i> senza apostrofo.'},
{k:'g',p:1,q:'Analizza le particelle in grassetto: complemento oggetto o complemento di termine?',cols:['Oggetto','Termine'],rows:[['<b>Vi</b> ho visti al cinema.',0],['<b>Gli</b> ho raccontato tutto.',1],['<b>La</b> chiamo ogni sera.',0],['<b>Mi</b> ha telefonato Anna.',1]],w:'<b>Lo, la, li, le</b> sono sempre oggetto; <b>gli</b> è sempre termine (a lui). Per <i>mi, ti, ci, vi</i> usa il test «me» / «a me».'},
{k:'g',p:1,q:'Analizza le parole in maiuscolo: soggetto partitivo, oggetto partitivo o specificazione?',cols:['Soggetto partitivo','Oggetto partitivo','Specificazione'],rows:[['Ho bevuto <b>DEL LATTE</b>.',1],['Il tetto <b>DELLA CASA</b> è nuovo.',2],['Arrivarono <b>DELLE AMICHE</b> di Sara.',0],['Le finestre <b>DEL SALOTTO</b> sono aperte.',2]],w:'Sostituisci con <b>«un po\' di / alcuni»</b>: se funziona è partitivo. <i>Del latte</i> = un po\' di latte (oggetto). <i>Delle amiche</i> = alcune amiche, che arrivano (soggetto).'},
{k:'g',p:3,q:'Nella frase «Da oggi Luca ti da un passaggio: da retta ai suoi consigli!» la parola «da» è scritta senza segni. Indica come va scritta.',cols:['Accento','Apostrofo','Nessun segno'],rows:[['DA (1): <b>da</b> oggi',2],['DA (2): ti <b>da</b> un passaggio',0],['DA (3): <b>da</b> retta',1]],w:'<b>Da</b> preposizione, <b>dà</b> verbo (dava), <b>da\'</b> ordine (dai).'},
{k:'g',p:2,q:'Indica se le frasi contengono verbi di forma passiva o attiva.',cols:['Passivo','Attivo'],rows:[['La finestra fu chiusa dal custode.',0],['Le nuvole sono arrivate dal mare.',1],['Il quadro è stato dipinto nel 1890.',0],['I ragazzi sono usciti presto.',1],['Il compito verrà corretto domani.',0]],w:'Passivo: il soggetto subisce (<i>fu chiusa, è stato dipinto, verrà corretto</i>). <i>Arrivare</i> e <i>uscire</i> sono intransitivi: attivi.'},
{k:'g',p:4,q:'La parola <b>TESTA</b> è polisemica. Individua il significato in ciascuna frase.',cols:['Parte del corpo','Parte anteriore','Intelligenza','Persona'],rows:[['Il premio è di cento euro a <b>testa</b>.',3],['Mi fa male la <b>testa</b>.',0],['Ha una <b>testa</b> fine: capisce tutto.',2],['Il sindaco è in <b>testa</b> al corteo.',1]],w:'Il significato dipende dal contesto. Prova a sostituire con un sinonimo: <i>a persona</i>, <i>la parte davanti</i>, <i>un\'intelligenza fine</i>.'},
{k:'g',p:4,q:'Indica come è usata la parola <b>ONDA</b>.',cols:['Specialistico','Metaforico','Proprio'],rows:[['Una grande <b>onda</b> di entusiasmo travolse la piazza.',1],['Le <b>onde</b> sonore si propagano nell\'aria.',0],['Le <b>onde</b> del mare si infrangevano sugli scogli.',2]],w:'<b>Proprio</b>: il movimento dell\'acqua del mare. <b>Specialistico</b>: termine della fisica (onde sonore). <b>Metaforico</b>: l\'entusiasmo che si diffonde come un\'onda.'}
];
var f=document.getElementById('f'),h='';
Q.forEach(function(x,i){
var pts=x.k=='s'?1:x.rows.length;x.pts=pts;
h+='<div class="q" id="q'+i+'"><div class="h"><span>Domanda '+(i+1)+' · '+P[x.p]+'</span><span>'+pts+(pts==1?' punto':' punti')+'</span></div><div class="t">'+x.q+'</div>';
if(x.k=='s'){x.o.forEach(function(o,j){h+='<label><input type="radio" name="q'+i+'" value="'+j+'">'+o+'</label>'})}
else{h+='<div class="tw"><table><tr><th></th>'+x.cols.map(function(c){return'<th>'+c+'</th>'}).join('')+'</tr>';
x.rows.forEach(function(r,k){h+='<tr id="q'+i+'r'+k+'"><td>'+r[0]+'</td>'+x.cols.map(function(c,j){return'<td><input type="radio" name="q'+i+'r'+k+'" value="'+j+'"></td>'}).join('')+'</tr>'});
h+='</table></div>'}
h+='<div class="w2" id="w'+i+'"></div></div>'});
f.innerHTML=h;
function val(n){var e=document.querySelector('input[name="'+n+'"]:checked');return e?+e.value:-1}
document.getElementById('go').onclick=function(){
var tot=0,max=0,per=P.map(function(){return[0,0]});
Q.forEach(function(x,i){var got=0,box=document.getElementById('q'+i),note='';
if(x.k=='s'){var v=val('q'+i);if(v==x.c)got=1;else note='Risposta corretta: <b>'+x.o[x.c].replace(/<[^>]+>/g,'')+'</b>. '}
else x.rows.forEach(function(r,k){var v=val('q'+i+'r'+k),tr=document.getElementById('q'+i+'r'+k);
if(v==r[1]){got++;tr.className='r-ok'}else{tr.className='r-ko';note+='Riga '+(k+1)+': <b>'+x.cols[r[1]]+'</b>. '}});
box.className='q '+(got==x.pts?'ok':'ko');
document.getElementById('w'+i).innerHTML=(got==x.pts?'✔ ':'✘ '+note)+'<br>'+x.w;
tot+=got;max+=x.pts;per[x.p][0]+=got;per[x.p][1]+=x.pts;
box.querySelectorAll('input').forEach(function(e){e.disabled=true})});
var r='<div class="big">'+tot+' / '+max+'</div><p>Risultato per argomento:</p>';
per.forEach(function(p,i){if(!p[1])return;var pc=Math.round(100*p[0]/p[1]);
r+='<div>'+P[i]+' · '+p[0]+'/'+p[1]+(pc<60?' → da ripassare':'')+'</div><div class="bar"><i style="width:'+pc+'%"></i></div>'});
r+='<button onclick="location.reload()">Riprova</button> <a class="menu" style="margin-left:12px" href="'+MENU_URL+'">Torna al menu</a>';
var e=document.getElementById('res');e.innerHTML=r;e.style.display='block';e.scrollIntoView({behavior:'smooth'});
this.style.display='none'};
</script>
</body>
</html>
