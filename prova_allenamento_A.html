<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova di allenamento A – Grammatica e lessico</title>
<style>
:root{--bg:#f6f1e7;--ink:#1e1c19;--mute:#7a7367;--card:#fffdf8;--line:#ddd3c0;--acc:#2b6cb0;--ok:#2f8f5b;--ko:#c62d3a;--okb:#e3f3ea;--kob:#fbe6e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--ink:#f3efe6;--mute:#9d978a;--card:#232127;--line:#3a3740;--acc:#6fb0f0;--ok:#63c98f;--ko:#f0666f;--okb:#1f3a2c;--kob:#40222a}}
:root[data-theme="dark"]{--bg:#17161a;--ink:#f3efe6;--mute:#9d978a;--card:#232127;--line:#3a3740;--acc:#6fb0f0;--ok:#63c98f;--ko:#f0666f;--okb:#1f3a2c;--kob:#40222a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:clamp(16px,1.7vw,19px);line-height:1.5}
.w{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:clamp(24px,4vw,36px);margin:.2em 0}
.menu{display:inline-block;margin-bottom:8px;color:var(--acc);text-decoration:none;font-size:.95em}
.sub{color:var(--mute);margin:0 0 1em}
.q{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.q.ok{border-color:var(--ok);background:var(--okb)}.q.ko{border-color:var(--ko);background:var(--kob)}
.h{display:flex;justify-content:space-between;gap:8px;font-size:.8em;color:var(--mute);margin-bottom:6px}
.t{font-weight:700;margin-bottom:8px}
label{display:block;padding:6px 8px;border-radius:8px;cursor:pointer}
label:hover{background:var(--line)}
input{margin-right:8px;accent-color:var(--acc)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th{font-size:.85em}td:first-child{text-align:left}
tr.r-ko td:first-child{color:var(--ko)}tr.r-ok td:first-child{color:var(--ok)}
.w2{margin-top:8px;font-size:.92em;color:var(--mute)}
.w2 b{color:var(--ink)}
button{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.6em 1.4em;cursor:pointer}
#res{display:none;background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:14px 16px;margin:14px 0}
#res .big{font-size:1.8em;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:2px 0 10px}.bar i{display:block;height:100%;background:var(--acc)}
</style>
</head>
<body>
<div class="w">
<a class="menu" id="menu" href="index.html">← Torna al menu</a>
<h1>Prova di allenamento A</h1>
<p class="sub">Grammatica e lessico · classe terza · 30 punti. Rispondi a tutte le domande, poi premi «Consegna».</p>
<div id="f"></div>
<button id="go">Consegna</button>
<div id="res"></div>
</div>
<script>
var MENU_URL='index.html'; // indirizzo della pagina con il menu (cambialo se il file ha un altro nome)
document.getElementById('menu').href=MENU_URL;
var P=['Parte 1 · La frase','Parte 2 · I complementi','Parte 3 · La forma del verbo','Parte 4 · Piccole parole','Parte 5 · Lessico'];
var Q=[
{k:'s',p:0,q:'In quale delle seguenti frasi <u>non</u> è presente un predicato nominale?',o:['Il mare è calmo stamattina.','Mia sorella è una ragazza molto gentile.','Quei libri sono ancora nuovi.','Le chiavi sono nel cassetto.'],c:3,w:'<b>Sono nel cassetto</b>: qui «essere» significa «si trovano» e ha un senso compiuto da solo, quindi è un predicato verbale. Nelle altre «essere» fa da collegamento: essere + nome del predicato (<i>è calmo, è una ragazza, sono nuovi</i>).'},
{k:'s',p:0,q:'In quale frase è presente un soggetto partitivo?',o:['Sono arrivati dei pacchi.','Ho letto dei racconti.','Il colore dei muri è chiaro.','Ho parlato con degli amici.'],c:0,w:'<b>Dei pacchi</b> = alcuni pacchi ed è chi «arriva»: soggetto partitivo. <i>Dei racconti</i> è oggetto partitivo, <i>dei muri</i> è specificazione, <i>con degli amici</i> è compagnia.'},
{k:'s',p:3,q:'In quale frase «CHE» ha funzione di pronome relativo?',o:['So che hai ragione.','Il film che abbiamo visto è lungo.','Era così stanco che si addormentò subito.','Credo che arriverà tardi.'],c:1,w:'Solo in <b>il film che abbiamo visto</b> puoi sostituire con «il quale». Negli altri casi «che» è congiunzione.'},
{k:'s',p:1,q:'In quale frase è presente un complemento d\'agente?',o:['Il paese fu sommerso dal fango.','Il ladro è stato arrestato dai carabinieri.','Vengo da Roma con il treno.','Il regalo è per te.'],c:1,w:'<b>Dai carabinieri</b> sono persone: complemento d\'agente. <i>Dal fango</i> è una cosa: causa efficiente.'},
{k:'s',p:2,q:'In quale frase c\'è un verbo di forma passiva?',o:['Le rondini sono partite presto.','La lettera viene consegnata domani.','Mi sono alzato tardi.','Il bambino cresceva in fretta.'],c:1,w:'<b>Viene consegnata</b>: venire + participio, il soggetto subisce. <i>Sono partite</i> è attiva (verbo intransitivo).'},
{k:'s',p:2,q:'Quale delle seguenti frasi contiene un verbo riflessivo?',o:['Ti telefono stasera.','Giulia si pettina davanti allo specchio.','Il maestro ci ha spiegato la regola.','Lo aspetto da un\'ora.'],c:1,w:'<b>Si pettina</b>: Giulia pettina se stessa. Negli altri casi il pronome indica un\'altra persona.'},
{k:'s',p:3,q:'In quale frase l\'ortografia è corretta?',o:['Non so perchè sia partito.','Da\' retta a tuo padre.','Qual\'è il tuo numero?','Mi da fastidio il rumore.'],c:1,w:'<b>Da\'</b> (imperativo di dare) vuole l\'apostrofo. Le altre: <i>perché</i> con accento acuto, <i>qual è</i> senza apostrofo, <i>mi dà</i> con l\'accento.'},
{k:'g',p:1,q:'Analizza la particella in grassetto: complemento oggetto o complemento di termine?',cols:['Oggetto','Termine'],rows:[['<b>Ti</b> ho visto ieri al parco.',0],['<b>Ci</b> hanno scritto una lettera.',1],['Non <b>mi</b> convince.',0],['<b>Ti</b> ho prestato il libro.',1]],w:'Test: <b>«te / noi / me»</b> (oggetto) oppure <b>«a te / a noi / a me»</b> (termine).'},
{k:'g',p:1,q:'Analizza le parole in maiuscolo: soggetto partitivo, oggetto partitivo o specificazione?',cols:['Soggetto partitivo','Oggetto partitivo','Specificazione'],rows:[['Sul tavolo c\'erano <b>DEI BICCHIERI</b>.',0],['La copertina <b>DEL QUADERNO</b> è rovinata.',2],['Ho invitato <b>DEGLI AMICI</b> a cena.',1],['Il profumo <b>DEI FIORI</b> riempiva la stanza.',2]],w:'Se puoi dire <b>«alcuni»</b> è partitivo. Se puoi chiedere <b>«di chi? di che cosa?»</b> è specificazione.'},
{k:'g',p:3,q:'Nella frase «Marta mi da un consiglio: da domani da retta a chi ti vuole bene» la parola «da» è scritta senza segni. Indica come va scritta.',cols:['Accento','Apostrofo','Nessun segno'],rows:[['DA (1): mi <b>da</b> un consiglio',0],['DA (2): <b>da</b> domani',2],['DA (3): <b>da</b> retta',1]],w:'<b>Dà</b> (dava) verbo, <b>da</b> preposizione, <b>da\'</b> (dai) ordine.'},
{k:'g',p:2,q:'Indica se le frasi contengono verbi di forma passiva o attiva.',cols:['Passivo','Attivo'],rows:[['I turisti furono accolti dal sindaco.',0],['Il treno è partito in ritardo.',1],['La casa è stata venduta ieri.',0],['Molti bambini sono cresciuti in campagna.',1],['La notizia viene ripetuta da tutti.',0]],w:'Passivo solo se il verbo è transitivo e il soggetto subisce. <i>Partire</i> e <i>crescere</i> sono intransitivi: attivi.'},
{k:'g',p:4,q:'La parola <b>DOLCE</b> è polisemica. Individua il significato in ciascuna frase.',cols:['Zuccherato','Gentile','Poco ripido','Non salata'],rows:[['Prendo un caffè <b>dolce</b>.',0],['Ha un sorriso <b>dolce</b>.',1],['La collina scende con un <b>dolce</b> pendio.',2],['I pesci di lago vivono in acqua <b>dolce</b>.',3]],w:'Il significato dipende dal nome vicino. Prova a sostituire con un sinonimo.'},
{k:'g',p:4,q:'Indica come è usata la parola <b>CHIAVE</b>.',cols:['Specialistico','Metaforico','Proprio'],rows:[['La <b>chiave</b> di violino si scrive all\'inizio del pentagramma.',0],['La puntualità è la <b>chiave</b> del successo.',1],['Ho perso la <b>chiave</b> di casa.',2]],w:'<b>Proprio</b>: l\'oggetto che apre la porta. <b>Metaforico</b>: il mezzo per ottenere qualcosa. <b>Specialistico</b>: termine della musica.'}
];
var f=document.getElementById('f'),h='';
Q.forEach(function(x,i){
var pts=x.k=='s'?1:x.rows.length;x.pts=pts;
h+='<div class="q" id="q'+i+'"><div class="h"><span>Domanda '+(i+1)+' · '+P[x.p]+'</span><span>'+pts+(pts==1?' punto':' punti')+'</span></div><div class="t">'+x.q+'</div>';
if(x.k=='s'){x.o.forEach(function(o,j){h+='<label><input type="radio" name="q'+i+'" value="'+j+'">'+o+'</label>'})}
else{h+='<div class="tw"><table><tr><th></th>'+x.cols.map(function(c){return'<th>'+c+'</th>'}).join('')+'</tr>';
x.rows.forEach(function(r,k){h+='<tr id="q'+i+'r'+k+'"><td>'+r[0]+'</td>'+x.cols.map(function(c,j){return'<td><input type="radio" name="q'+i+'r'+k+'" value="'+j+'"></td>'}).join('')+'</tr>'});
h+='</table></div>'}
h+='<div class="w2" id="w'+i+'"></div></div>'});
f.innerHTML=h;
function val(n){var e=document.querySelector('input[name="'+n+'"]:checked');return e?+e.value:-1}
document.getElementById('go').onclick=function(){
var tot=0,max=0,per=P.map(function(){return[0,0]});
Q.forEach(function(x,i){var got=0,box=document.getElementById('q'+i),note='';
if(x.k=='s'){var v=val('q'+i);if(v==x.c)got=1;else note='Risposta corretta: <b>'+x.o[x.c].replace(/<[^>]+>/g,'')+'</b>. '}
else x.rows.forEach(function(r,k){var v=val('q'+i+'r'+k),tr=document.getElementById('q'+i+'r'+k);
if(v==r[1]){got++;tr.className='r-ok'}else{tr.className='r-ko';note+='Riga '+(k+1)+': <b>'+x.cols[r[1]]+'</b>. '}});
box.className='q '+(got==x.pts?'ok':'ko');
document.getElementById('w'+i).innerHTML=(got==x.pts?'✔ ':'✘ '+note)+'<br>'+x.w;
tot+=got;max+=x.pts;per[x.p][0]+=got;per[x.p][1]+=x.pts;
box.querySelectorAll('input').forEach(function(e){e.disabled=true})});
var r='<div class="big">'+tot+' / '+max+'</div><p>Risultato per argomento:</p>';
per.forEach(function(p,i){if(!p[1])return;var pc=Math.round(100*p[0]/p[1]);
r+='<div>'+P[i]+' · '+p[0]+'/'+p[1]+(pc<60?' → da ripassare':'')+'</div><div class="bar"><i style="width:'+pc+'%"></i></div>'});
r+='<button onclick="location.reload()">Riprova</button> <a class="menu" style="margin-left:12px" href="'+MENU_URL+'">Torna al menu</a>';
var e=document.getElementById('res');e.innerHTML=r;e.style.display='block';e.scrollIntoView({behavior:'smooth'});
this.style.display='none'};
</script>
</body>
</html>
